<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练数据采集器 · AthleteIQ</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f9;
  --line:#e2e8f0; --line-2:#cbd5e1;
  --text:#16203a; --text-2:#5b6780; --text-3:#8b97ad;
  --accent:#3f51b5; --accent-soft:#eef1fb; --accent-2:#6572cd;
  --blue:#2563eb; --teal:#0d9488; --green:#16a34a; --amber:#d97706; --red:#dc2626; --purple:#7c3aed;
  --ok-bg:#e9f7ef; --warn-bg:#fdf4e3; --dang-bg:#fdecec; --mute-bg:#eef1f6;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 6px 18px rgba(16,32,64,.06);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd8e6;border-radius:6px}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.brand small{display:block;font-size:.62rem;font-weight:500;color:var(--text-3);letter-spacing:1.2px;line-height:1}
.topState{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--mute-bg);color:var(--text-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--green)}
.pill.warn{background:var(--warn-bg);color:var(--amber)}
.pill.dang{background:var(--dang-bg);color:var(--red)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.modesw{display:flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.modesw button{border:0;background:transparent;padding:5px 13px;border-radius:8px;font-size:.76rem;font-weight:700;color:var(--text-2);cursor:pointer;transition:.18s}
.modesw button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,32,64,.12)}

/* ============ 导航 ============ */
.tabbar{position:sticky;top:57px;z-index:55;background:var(--surface);border-bottom:1px solid var(--line)}
.tabbar-in{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.tabbar button{border:0;background:transparent;padding:11px 14px;font-size:.83rem;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.15s}
.tabbar button:hover{color:var(--text)}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabbar button svg{width:15px;height:15px}

/* ============ 布局 ============ */
main{max-width:1280px;margin:0 auto;padding:18px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gside{grid-template-columns:minmax(0,1fr) 340px}
@media(max-width:1080px){.gside{grid-template-columns:1fr}}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2,.g3.keep2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g4.keep2,.g3.keep2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--surface-2)}
.card-h h3{font-size:.92rem;font-weight:800;letter-spacing:.2px}
.card-h .hint{font-size:.72rem;color:var(--text-3);font-weight:500}
.card-h .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:15px 16px}
.card-b.tight{padding:10px 14px}
.sep{height:1px;background:var(--line);margin:12px 0}

.pageTitle{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pageTitle h2{font-size:1.25rem;font-weight:800;letter-spacing:.3px}
.pageTitle p{font-size:.8rem;color:var(--text-2)}
.pageTitle .r{margin-left:auto}

/* ============ 通用元素 ============ */
.btn{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);color:#fff}
.btn.sm{padding:4px 9px;font-size:.72rem;border-radius:7px}
.btn.dang{color:var(--red);border-color:#f3c6c6}
.btn.dang:hover{background:var(--dang-bg);border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}

.field{margin-bottom:11px}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--text-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;background:#fff;font-size:.83rem;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,81,181,.11)}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.tile{display:block;text-decoration:none;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:.18s}
.tile:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.tile b{display:block;font-size:.86rem;font-weight:800;margin-bottom:4px;color:var(--text)}
.tile span{display:block;font-size:.76rem;color:var(--text-2);line-height:1.55}
.tile em{display:block;font-style:normal;font-size:.72rem;font-weight:700;color:var(--accent);margin-top:8px}
.hint{font-size:.72rem;color:var(--text-3);font-weight:500}
.row>*{flex:1;min-width:130px}
.chkline{display:flex;gap:8px;align-items:flex-start}
.chkline input{margin-top:3px;flex-shrink:0;width:15px;height:15px;accent-color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:8px 10px;background:var(--surface-2);color:var(--text-3);font-size:.7rem;letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.tnum{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.metric .k{font-size:.68rem;color:var(--text-3);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.metric .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.metric .v u{font-size:.7rem;font-weight:600;text-decoration:none;color:var(--text-3);margin-left:2px}
.metric .s{font-size:.7rem;color:var(--text-2)}

.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.g i{background:var(--green)}.bar.a i{background:var(--amber)}.bar.r i{background:var(--red)}

.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.68rem;font-weight:700;background:var(--mute-bg);color:var(--text-2);margin:1px 3px 1px 0}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.g{background:var(--ok-bg);color:var(--green)}
.tag.y{background:var(--warn-bg);color:var(--amber)}
.tag.r{background:var(--dang-bg);color:var(--red)}
.tag.t{background:#e3f5f3;color:var(--teal)}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 9px 9px 0;font-size:.8rem;color:var(--text-2);margin:10px 0}
.note.warn{border-color:var(--amber);background:var(--warn-bg)}
.note.dang{border-color:var(--red);background:var(--dang-bg)}
.note.ok{border-color:var(--green);background:var(--ok-bg)}

/* 清单 */
.check{padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;display:flex;gap:11px;align-items:flex-start;transition:.15s}
.check:hover{border-color:var(--line-2);background:var(--surface-2)}
.check.done{background:var(--surface-2);border-color:#d9e3d9}
.check.done .ct{text-decoration:line-through;color:var(--text-3)}
.check input[type=checkbox]{width:17px;height:17px;margin-top:3px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.check .cbody{flex:1;min-width:0}
.check .ct{font-weight:700;font-size:.86rem}
.check .cd{font-size:.76rem;color:var(--text-2);margin-top:2px}
.check .cmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.check .cmeta .amt{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}

/* 手风琴 */
details.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
details.acc>summary{padding:11px 13px;cursor:pointer;font-weight:700;font-size:.85rem;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:.2s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.acc-b{padding:12px 14px;font-size:.82rem;color:var(--text-2)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.8rem}
.kv dt{color:var(--text-3);font-weight:700;white-space:nowrap}
.kv dd{color:var(--text)}

ol.steps{margin:0;padding-left:1.15rem}
ol.steps li{margin-bottom:5px;font-size:.82rem}
ul.plain{margin:0;padding-left:1.05rem}
ul.plain li{margin-bottom:4px;font-size:.82rem}

.lvbar{display:inline-flex;align-items:center;gap:3px}
.lvbar i{width:5px;height:13px;border-radius:2px;background:var(--surface-3)}
.lvbar i.on{background:var(--accent)}

.empty{text-align:center;padding:26px 14px;color:var(--text-3);font-size:.82rem}
.empty svg{width:34px;height:34px;opacity:.35;display:block;margin:0 auto 8px}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.hashmark{position:absolute;width:0;height:0;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--text-2);margin-top:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:9px 18px;border-radius:10px;font-size:.82rem;font-weight:600;z-index:999;opacity:0;transition:.28s;box-shadow:0 10px 30px rgba(0,0,0,.22)}
#toast.on{transform:translateX(-50%);opacity:1}

.videoWrap{position:relative;background:#0f1420;border-radius:10px;overflow:hidden}
.videoWrap video{width:100%;display:block;max-height:260px}
.dropzone{border:2px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:.15s;background:var(--surface-2)}
.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone svg{width:30px;height:30px;color:var(--text-3);margin-bottom:6px}

.progressline{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.progressline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .3s}

footer{max-width:1280px;margin:22px auto;padding:16px 18px 30px;color:var(--text-3);font-size:.72rem;border-top:1px solid var(--line)}

@media print{
  .topbar,.tabbar,footer,.noprint{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  main{padding:0;max-width:none}
}

/* 采集器 / 规范页专属（沿用工作台同一组变量） */
.subsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subsel select{max-width:190px}
code{font-family:ui-monospace,Consolas,monospace;background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:.82em}
ol.plain,ul.plain{padding-left:20px}
ol.plain li,ul.plain li{margin:3px 0}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .topbar-in{padding:8px 12px;gap:8px}
  .tabbar-in{padding:0 12px}
  main{padding:12px}
  .topState{width:100%;margin-left:0}
  .subsel{width:100%}
  .pageTitle h2{font-size:1.1rem}
  table{font-size:.78rem}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l8-8M11 4l9 9M15 4h5v5"/><circle cx="6" cy="6" r="2.2"/></svg></span>
      <span>训练数据采集器<small>ATHLETEIQ DATA COLLECTOR</small></span>
    </div>
    <div class="topState" id="topState"></div>
    <div class="subsel">
      <select id="subjectSel" title="切换运动员"></select>
      <button class="btn sm" data-act="newsubject">＋ 运动员</button>
      <button class="btn sm" data-act="renamesubject">改名</button>
      <button class="btn sm dang" data-act="delsubject">删除</button>
    </div>
  </div>
</header>
<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>
<main>
<span id="quick" class="hashmark"></span><span id="weekly" class="hashmark"></span>
<span id="tests" class="hashmark"></span><span id="wear" class="hashmark"></span>
<span id="video" class="hashmark"></span><span id="records" class="hashmark"></span>
<span id="sync" class="hashmark"></span>
  <section class="view on" id="view-quick"></section>
  <section class="view" id="view-weekly"></section>
  <section class="view" id="view-tests"></section>
  <section class="view" id="view-wear"></section>
  <section class="view" id="view-video"></section>
  <section class="view" id="view-records"></section>
  <section class="view" id="view-sync"></section>
</main>
<footer>纯本地采集：所有内容保存在本机浏览器 localStorage，不上传任何服务器。导出采集包后到「专项教练工作台 → 数据接入 → 导入采集包」合并，工作台会按新数据重算清单、等级与诊断。</footer>
<div id="toast"></div>
<script>
"use strict";
/* ===== 默认字段来自工作台配置层；导入工作台配置包后自动同步 ===== */

let VIEW="quick",ST=null,CFG=null,DAY="",LOGROWS=[],RECKEY="logs",CSVKIND="wear",DRAFT={};

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){const p=String(s).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function round(v,n){const p=Math.pow(10,n||0);return Math.round(v*p)/p;}
function el(id){return document.getElementById(id);}
function toast(m){const t=el("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200);}
function dl(name,text,mime){const b=new Blob([text],{type:mime||"application/json;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);}

function newSubject(name){return {id:uid(),name:name||"运动员",created:todayISO(),profile:{},
  logs:[],mind:[],weekly:[],wear:[],tests:[],vids:[],levels:[],skills:{}};}
function load(){
  try{ST=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){ST=null;}
  if(!ST||!Array.isArray(ST.subjects)||!ST.subjects.length)ST={active:0,subjects:[newSubject("运动员 1")],cfg:null};
  if(!Number.isInteger(ST.active)||ST.active>=ST.subjects.length)ST.active=0;
  ST.subjects.forEach(s=>{["logs","mind","weekly","wear","tests","vids","levels"].forEach(k=>{
    if(!Array.isArray(s[k]))s[k]=[];});if(!s.skills||typeof s.skills!=="object")s.skills={};});
  CFG=ST.cfg&&ST.cfg.dailyQ?ST.cfg:DEFAULT_CFG;
  DAY=todayISO();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){toast("保存失败：本地存储空间不足");}}
function cur(){return ST.subjects[ST.active];}
function clearDraft(prefix){Object.keys(DRAFT).forEach(k=>{if(k.indexOf(prefix)===0)delete DRAFT[k];});}

/* ===== 动态表单：字段完全来自配置包 ===== */
function formHTML(list,prefix,values){
  return '<div class="grid g3">'+list.map(q=>{
    const k=prefix+q.k;
    const v=(values&&values[q.k]!=null)?values[q.k]:(DRAFT[k]!=null?DRAFT[k]:(q.def!=null?q.def:""));
    const t=q.type==="sel"?"sel":(q.type==="num"?"num":"txt");
    let inp;
    if(t==="sel"){
      const opts=(q.opt||q.opts||[]).map(o=>{
        const val=Array.isArray(o)?o[0]:o,lab=Array.isArray(o)?o[1]:o;
        return '<option value="'+esc(val)+'" '+(String(v)===String(val)?"selected":"")+'>'+esc(lab)+'</option>';
      }).join("");
      inp='<select data-f="'+esc(k)+'">'+opts+'</select>';
    }else if(t==="num"){
      inp='<input type="number" data-f="'+esc(k)+'" value="'+esc(v)+'"'+
        (q.min!=null?' min="'+q.min+'"':"")+(q.max!=null?' max="'+q.max+'"':"")+
        ' step="'+(q.step||"any")+'">';
    }else inp='<input type="text" data-f="'+esc(k)+'" value="'+esc(v)+'">';
    return '<div class="field"><label>'+esc(q.n)+(q.unit?'（'+esc(q.unit)+'）':"")+'</label>'+inp+'</div>';
  }).join("")+'</div>';
}
function collectForm(list,prefix){
  const o={};
  list.forEach(q=>{
    const n=document.querySelector('[data-f="'+prefix+q.k+'"]');
    let v=n?n.value:(DRAFT[prefix+q.k]!=null?DRAFT[prefix+q.k]:q.def);
    if(q.type==="num"){if(v!==""&&v!=null&&!isNaN(+v))o[q.k]=+v;}
    else if(q.type==="sel"){o[q.k]=isNaN(+v)?v:+v;}
    else o[q.k]=String(v==null?"":v);
  });
  return o;
}
function logRowsFromDate(d){return cur().logs.filter(x=>x.date===d).map(x=>({dur:x.dur,rpe:x.rpe,type:x.type,note:x.note}));}
function syncLogRows(){
  const rows=[];
  document.querySelectorAll('[data-lr="dur"]').forEach(n=>{
    const i=n.dataset.i;
    const g=k=>{const x=document.querySelector('[data-lr="'+k+'"][data-i="'+i+'"]');return x?x.value:"";};
    rows.push({dur:+g("dur")||0,rpe:+g("rpe")||0,type:g("type"),note:g("note")});
  });
  if(rows.length)LOGROWS=rows;
}
function logRowsHTML(){
  if(!LOGROWS.length)LOGROWS=[{dur:60,rpe:6,type:"tech",note:""}];
  return LOGROWS.map((r,i)=>'<tr>'+
    '<td><input type="number" min="0" max="600" data-lr="dur" data-i="'+i+'" value="'+esc(r.dur)+'"></td>'+
    '<td><input type="number" min="1" max="10" data-lr="rpe" data-i="'+i+'" value="'+esc(r.rpe)+'"></td>'+
    '<td><select data-lr="type" data-i="'+i+'">'+
      [["tech","技术"],["cond","体能"],["match","对抗"],["recovery","恢复"],["rest","休息"]].map(o=>
        '<option value="'+o[0]+'" '+(r.type===o[0]?"selected":"")+'>'+o[1]+'</option>').join("")+'</select></td>'+
    '<td><input type="text" data-lr="note" data-i="'+i+'" value="'+esc(r.note||"")+'" placeholder="选填"></td>'+
    '<td><button class="btn sm dang" data-act="dellogrow" data-i="'+i+'">删</button></td></tr>').join("");
}
function pageTitle(t,p,right){return '<div class="pageTitle"><h2>'+t+'</h2><p>'+p+'</p>'+

function quality(){
  const s=cur(),d=todayISO(),days=[];for(let i=27;i>=0;i--)days.push(addDays(d,-i));
  const issues=[];
  const gap=days.filter(x=>!s.logs.some(l=>l.date===x)).length;
  const gapM=days.filter(x=>!s.mind.some(m=>m.date===x)).length;
  if(!s.logs.length)issues.push({lv:"high",t:"没有训练日志：工作台无法计算负荷与 ACWR。"});
  else if(gap>14)issues.push({lv:"mid",t:"近 28 天有 "+gap+" 天没有训练记录（休息日也建议记一条 rest）。"});
  if(!s.mind.length)issues.push({lv:"high",t:"没有每日打卡：准备度与恢复域会保持「未评估」。"});
  else if(gapM>7)issues.push({lv:"mid",t:"打卡缺口 "+gapM+" 天。"});
  if(!s.tests.length)issues.push({lv:"mid",t:"没有体能测评：体能域无法评估。"});
  if(!s.wear.length)issues.push({lv:"mid",t:"没有穿戴数据：HRV / 静息心率预警不会触发。"});
  const bad=s.logs.filter(l=>+l.rpe>10||+l.rpe<1||+l.dur>600).length+
    s.mind.filter(m=>+m.sleep>14||+m.sleep<0||+m.pain>5).length;
  if(bad)issues.push({lv:"high",t:"发现 "+bad+" 条超出合理范围的数据，导出前请核对。"});
  ["mind","wear","tests"].forEach(k=>{
    const seen={};let dup=0;s[k].forEach(x=>{if(seen[x.date])dup++;seen[x.date]=1;});
    if(dup)issues.push({lv:"mid",t:k+" 有 "+dup+" 个重复日期。"});
  });
  const have=[s.logs.length,s.mind.length,s.wear.length,s.tests.length,s.vids.length].filter(Boolean).length;
  return {issues:issues,score:Math.round(have/5*100),
    counts:{logs:s.logs.length,mind:s.mind.length,weekly:s.weekly.length,
      wear:s.wear.length,tests:s.tests.length,vids:s.vids.length}};
}
function packFor(s){

    profile:s.profile||{},logs:s.logs,mind:s.mind,weekly:s.weekly,wear:s.wear,
    tests:s.tests,vids:s.vids,levels:s.levels,skills:s.skills};
}

/* ===== 数据操作 ===== */
function parseCSV(txt){
  const lines=String(txt).split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)throw new Error("没有内容");
  const head=lines[0].split(",").map(x=>x.trim().toLowerCase().replace(/^"|"$/g,""));
  const map={date:["date","日期"],rhr:["resting_hr","rhr","静息心率"],hrv:["hrv","rMSSD".toLowerCase()],
    sleepH:["sleep_hours","sleep","sleeph","睡眠"],steps:["steps","步数"],load:["load","负荷","training_load"]};
  const idx={};Object.keys(map).forEach(k=>idx[k]=head.findIndex(h=>map[k].indexOf(h)>=0));
  if(idx.date<0)throw new Error("缺少 date / 日期 列");
  const out=[];
  lines.slice(1).forEach(line=>{
    const c=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
    const d=c[idx.date];if(!d)return;
    const o={date:d};
    [["rhr",idx.rhr],["hrv",idx.hrv],["sleepH",idx.sleepH],["steps",idx.steps],["load",idx.load]].forEach(p=>{
      if(p[1]>=0&&c[p[1]]!==""&&!isNaN(+c[p[1]]))o[p[0]]=+c[p[1]];
    });
    out.push(o);
  });
  if(!out.length)throw new Error("没有解析到有效数据行");
  return out;
}
function toCSV(arr,cols){
  return cols.join(",")+"\n"+arr.map(r=>cols.map(c=>{
    let v=r[c];if(v==null)v="";
    if(typeof v==="object")v=JSON.stringify(v);
    v=String(v).replace(/"/g,'""');
    return /[,\n"]/.test(v)?'"'+v+'"':v;
  }).join(",")).join("\n")+"\n";
}
function exportPack(all){
  let data,name;
  if(all){
    data={type:"bwb.collect.batch",v:1,exportedAt:new Date().toISOString(),
      subjects:ST.subjects.map(s=>Object.assign({},packFor(s),{name:s.name,id:s.id}))};
    name="bwb-collect-all-"+todayISO()+".json";
  }else{
    data=packFor(cur());name="bwb-collect-"+cur().name.replace(/[\\/:*?"<>|]/g,"_")+"-"+todayISO()+".json";
  }
  dl(name,JSON.stringify(data,null,2));
  toast(all?"已导出 "+ST.subjects.length+" 个运动员的批量采集包":"已导出 "+cur().name+" 的采集包");
}
function exportCSV(){
  const s=cur(),arr=s[CSVKIND]||[];
  let cols=[];
  if(CSVKIND==="logs")cols=["date","dur","rpe","type","note"];
  else if(CSVKIND==="mind")cols=["date"].concat(CFG.dailyQ.map(q=>q.k));
  else if(CSVKIND==="wear")cols=["date","rhr","hrv","sleepH","steps","load"];
  else if(CSVKIND==="tests")cols=["date"].concat(CFG.tests.map(t=>t.id));
  else cols=["date","tech","file","pose","note"];
  const rows=CSVKIND==="tests"?arr.map(t=>Object.assign({date:t.date},t.res||{})):arr;
  dl("bwb-"+CSVKIND+"-"+s.name.replace(/[\\/:*?"<>|]/g,"_")+"-"+todayISO()+".csv",toCSV(rows,cols),"text/csv;charset=utf-8");
  toast("已导出 "+arr.length+" 条 "+CSVKIND+" 记录");
}
function onCfgFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||!Array.isArray(d.dailyQ)||!Array.isArray(d.tests))throw new Error("不是有效的 bwb.config 配置包（缺少 dailyQ / tests）");
      ST.cfg=d;CFG=d;save();DRAFT={};render();
      const o=el("cfgOut");
      if(o)o.innerHTML='<div class="note ok">配置包已应用：打卡 '+d.dailyQ.length+' 项、测评 '+d.tests.length+
        ' 项、技术 '+(d.tech||[]).length+' 项。表单已按新字段重建。</div>';
      toast("字段已与工作台同步");
    }catch(e){const o=el("cfgOut");if(o)o.innerHTML='<div class="note dang">导入失败：'+esc(e.message)+'</div>';}
  };
  fr.readAsText(file);
}

document.addEventListener("click",function(e){
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,s=cur();
  switch(a){
    case "nav": go(b.dataset.v); break;
    case "addlogrow": syncLogRows();LOGROWS.push({dur:60,rpe:6,type:"tech",note:""});render();break;
    case "dellogrow": syncLogRows();LOGROWS.splice(+b.dataset.i,1);render();break;
    case "savequick":{
      const d=el("qDate").value||DAY;DAY=d;
      const m=Object.assign({date:d},collectForm(CFG.dailyQ,"q."));
      syncLogRows();
      s.mind=s.mind.filter(x=>x.date!==d);s.mind.push(m);
      s.logs=s.logs.filter(x=>x.date!==d);
      LOGROWS.filter(r=>+r.dur>0&&+r.rpe>0).forEach(r=>s.logs.push(
        {id:uid(),date:d,dur:+r.dur,rpe:+r.rpe,type:r.type,note:r.note}));
      LOGROWS=[];clearDraft("q.");save();render();toast("已保存 "+d+" 的打卡与 "+s.logs.filter(x=>x.date===d).length+" 条训练");
      break;
    }
    case "saveweekly":{
      const wk=weekISO(),o=Object.assign({date:todayISO(),week:wk},collectForm(CFG.weeklyQ,"w."));
      s.weekly=s.weekly.filter(x=>x.week!==wk);s.weekly.push(o);clearDraft("w.");save();render();toast("本周问卷已保存");break;
    }
    case "savetests":{
      const d=el("tDate").value||DAY,res={};
      document.querySelectorAll("[data-t]").forEach(n=>{if(n.value!=="")res[n.dataset.t]=parseFloat(n.value);});
      if(!Object.keys(res).length){toast("至少填写一项测评值");break;}
      s.tests=s.tests.filter(x=>x.date!==d);s.tests.push({id:uid(),date:d,res:res});
      save();render();toast("已保存 "+Object.keys(res).length+" 项测评");break;
    }
    case "parsewear":{
      try{
        const rows=parseCSV(el("wearCsv").value);
        rows.forEach(r=>{s.wear=s.wear.filter(x=>x.date!==r.date);s.wear.push(r);});
        save();render();
        const o=el("wearOut");if(o)o.innerHTML='<div class="note ok">已合并 '+rows.length+' 条穿戴数据。</div>';
      }catch(err){const o=el("wearOut");if(o)o.innerHTML='<div class="note dang">'+esc(err.message)+'</div>';}
      break;
    }
    case "savewear":{
      const d=el("w_date").value||todayISO(),o={date:d};
      [["w_rhr","rhr"],["w_hrv","hrv"],["w_sleep","sleepH"],["w_steps","steps"],["w_load","load"]].forEach(p=>{
        const v=el(p[0]).value;if(v!=="")o[p[1]]=parseFloat(v);});
      s.wear=s.wear.filter(x=>x.date!==d);s.wear.push(o);save();render();toast("已保存 "+d+" 穿戴数据");break;
    }
    case "delwear": s.wear=s.wear.filter(x=>x.date!==b.dataset.d);save();render();break;
    case "dlweartpl":{
      const head="date,resting_hr,hrv,sleep_hours,steps,load\n";
      const rows=[];for(let i=6;i>=0;i--)rows.push([addDays(todayISO(),-i),55,70,7.5,8500,""].join(","));
      dl("bwb-wear-template.csv",head+rows.join("\n")+"\n","text/csv;charset=utf-8");
      toast("CSV 模板已下载");break;
    }
    case "savevideo":{
      const v={id:uid(),date:el("v_date").value||DAY,tech:el("v_tech").value,
        file:el("v_file").value,pose:el("v_pose").value,note:el("v_note").value};
      if(!v.file&&!v.pose){toast("请至少填一个文件名");break;}
      s.vids.push(v);save();render();toast("视频记录已保存");break;
    }
    case "delvid": s.vids=s.vids.filter(x=>x.id!==b.dataset.id);save();render();break;
    case "delrec":{
      const id=b.dataset.id;
      s[RECKEY]=s[RECKEY].filter(x=>String(x.id||x.date||x.week)!==String(id));
      save();render();toast("已删除");break;
    }
    case "clearsubject":{
      if(confirm("清空「"+s.name+"」的全部采集数据？此操作不可撤销，建议先导出采集包。")){
        const n=s.name,id=s.id,ns=newSubject(n);ns.id=id;
        ST.subjects[ST.active]=ns;LOGROWS=[];save();render();toast("已清空 "+n+" 的数据");
      }
      break;
    }
    case "newsubject":{
      const n=prompt("新运动员姓名 / 编号：","运动员 "+(ST.subjects.length+1));
      if(n&&n.trim()){ST.subjects.push(newSubject(n.trim()));ST.active=ST.subjects.length-1;
        LOGROWS=[];DRAFT={};save();render();toast("已新增并切换到 "+n.trim());}
      break;
    }
    case "renamesubject":{
      const n=prompt("修改当前档案名称：",s.name);
      if(n&&n.trim()){s.name=n.trim();save();render();toast("已改名");}
      break;
    }
    case "delsubject":{
      if(ST.subjects.length<=1){toast("至少保留一个档案");break;}
      if(confirm("删除档案「"+s.name+"」及其全部数据？")){
        ST.subjects.splice(ST.active,1);ST.active=0;LOGROWS=[];save();render();toast("已删除");}
      break;
    }
    case "pickcfg": el("cfgFile").click(); break;
    case "resetcfg": ST.cfg=null;CFG=DEFAULT_CFG;DRAFT={};save();render();toast("已恢复内置默认字段");break;
    case "exportone": exportPack(false); break;
    case "exportall": exportPack(true); break;
    case "exportcsv": exportCSV(); break;
    case "dltemplate":{
      dl("bwb-collect-template.json",JSON.stringify({
        type:"bwb.collect",v:1,exportedAt:new Date().toISOString(),
        subject:{name:"",id:""},logs:[],mind:[],weekly:[],wear:[],tests:[],vids:[],levels:[],skills:{}
      },null,2));toast("空白采集包模板已下载");break;
    }
  }
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="qDate"){syncLogRows();LOGROWS=[];DAY=t.value;render();}
  if(t.id==="tDate"){DAY=t.value;}
  if(t.id==="recKey"){RECKEY=t.value;render();}
  if(t.id==="csvKind"){CSVKIND=t.value;}
  if(t.id==="subjectSel"){ST.active=parseInt(t.value)||0;LOGROWS=[];DRAFT={};save();render();}
  if(t.dataset&&t.dataset.act==="wearfile"&&t.files&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{el("wearCsv").value=fr.result;toast("CSV 已载入，点「解析并合并」");};fr.readAsText(t.files[0]);
  }
  if(t.dataset&&t.dataset.act==="cfgfile"&&t.files&&t.files[0])onCfgFile(t.files[0]);
});
document.addEventListener("input",function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.f)DRAFT[t.dataset.f]=t.value;
});
load();
try{const h=String(location.hash||"").replace(/^#/,"");if(TABS.some(t=>t.id===h))VIEW=h;}catch(e){}
try{window.addEventListener("hashchange",function(){
  const h=String(location.hash||"").replace(/^#/,"");if(TABS.some(t=>t.id===h)){VIEW=h;LOGROWS=[];render();}
});}catch(e){}
render();
</script>
</body>
</html>
