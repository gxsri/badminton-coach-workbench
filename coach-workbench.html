<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽毛球专项教练工作台 · AthleteIQ</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f9;
  --line:#e2e8f0; --line-2:#cbd5e1;
  --text:#16203a; --text-2:#5b6780; --text-3:#8b97ad;
  --accent:#3f51b5; --accent-soft:#eef1fb; --accent-2:#6572cd;
  --blue:#2563eb; --teal:#0d9488; --green:#16a34a; --amber:#d97706; --red:#dc2626; --purple:#7c3aed;
  --ok-bg:#e9f7ef; --warn-bg:#fdf4e3; --dang-bg:#fdecec; --mute-bg:#eef1f6;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 6px 18px rgba(16,32,64,.06);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd8e6;border-radius:6px}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.brand small{display:block;font-size:.62rem;font-weight:500;color:var(--text-3);letter-spacing:1.2px;line-height:1}
.topState{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--mute-bg);color:var(--text-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--green)}
.pill.warn{background:var(--warn-bg);color:var(--amber)}
.pill.dang{background:var(--dang-bg);color:var(--red)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.modesw{display:flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.modesw button{border:0;background:transparent;padding:5px 13px;border-radius:8px;font-size:.76rem;font-weight:700;color:var(--text-2);cursor:pointer;transition:.18s}
.modesw button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,32,64,.12)}

/* ============ 导航 ============ */
.tabbar{position:sticky;top:57px;z-index:55;background:var(--surface);border-bottom:1px solid var(--line)}
.tabbar-in{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.tabbar button{border:0;background:transparent;padding:11px 14px;font-size:.83rem;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.15s}
.tabbar button:hover{color:var(--text)}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabbar button svg{width:15px;height:15px}

/* ============ 布局 ============ */
main{max-width:1280px;margin:0 auto;padding:18px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gside{grid-template-columns:minmax(0,1fr) 340px}
@media(max-width:1080px){.gside{grid-template-columns:1fr}}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2,.g3.keep2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g4.keep2,.g3.keep2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--surface-2)}
.card-h h3{font-size:.92rem;font-weight:800;letter-spacing:.2px}
.card-h .hint{font-size:.72rem;color:var(--text-3);font-weight:500}
.card-h .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-b{padding:15px 16px}
.card-b.tight{padding:10px 14px}
.sep{height:1px;background:var(--line);margin:12px 0}

.pageTitle{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pageTitle h2{font-size:1.25rem;font-weight:800;letter-spacing:.3px}
.pageTitle p{font-size:.8rem;color:var(--text-2)}
.pageTitle .r{margin-left:auto}

/* ============ 通用元素 ============ */
.btn{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);color:#fff}
.btn.sm{padding:4px 9px;font-size:.72rem;border-radius:7px}
.btn.dang{color:var(--red);border-color:#f3c6c6}
.btn.dang:hover{background:var(--dang-bg);border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}

.field{margin-bottom:11px}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--text-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;background:#fff;font-size:.83rem;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,81,181,.11)}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.chkline{display:flex;gap:8px;align-items:flex-start}
.chkline input{margin-top:3px;flex-shrink:0;width:15px;height:15px;accent-color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:8px 10px;background:var(--surface-2);color:var(--text-3);font-size:.7rem;letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.tnum{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.metric .k{font-size:.68rem;color:var(--text-3);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.metric .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.metric .v u{font-size:.7rem;font-weight:600;text-decoration:none;color:var(--text-3);margin-left:2px}
.metric .s{font-size:.7rem;color:var(--text-2)}

.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.g i{background:var(--green)}.bar.a i{background:var(--amber)}.bar.r i{background:var(--red)}

.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.68rem;font-weight:700;background:var(--mute-bg);color:var(--text-2);margin:1px 3px 1px 0}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.g{background:var(--ok-bg);color:var(--green)}
.tag.y{background:var(--warn-bg);color:var(--amber)}
.tag.r{background:var(--dang-bg);color:var(--red)}
.tag.t{background:#e3f5f3;color:var(--teal)}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 9px 9px 0;font-size:.8rem;color:var(--text-2);margin:10px 0}
.note.warn{border-color:var(--amber);background:var(--warn-bg)}
.note.dang{border-color:var(--red);background:var(--dang-bg)}
.note.ok{border-color:var(--green);background:var(--ok-bg)}

/* 清单 */
.check{padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;display:flex;gap:11px;align-items:flex-start;transition:.15s}
.check:hover{border-color:var(--line-2);background:var(--surface-2)}
.check.done{background:var(--surface-2);border-color:#d9e3d9}
.check.done .ct{text-decoration:line-through;color:var(--text-3)}
.check input[type=checkbox]{width:17px;height:17px;margin-top:3px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.check .cbody{flex:1;min-width:0}
.check .ct{font-weight:700;font-size:.86rem}
.check .cd{font-size:.76rem;color:var(--text-2);margin-top:2px}
.check .cmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.check .cmeta .amt{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}

/* 手风琴 */
details.acc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
details.acc>summary{padding:11px 13px;cursor:pointer;font-weight:700;font-size:.85rem;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:.2s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.acc-b{padding:12px 14px;font-size:.82rem;color:var(--text-2)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.8rem}
.kv dt{color:var(--text-3);font-weight:700;white-space:nowrap}
.kv dd{color:var(--text)}

ol.steps{margin:0;padding-left:1.15rem}
ol.steps li{margin-bottom:5px;font-size:.82rem}
ul.plain{margin:0;padding-left:1.05rem}
ul.plain li{margin-bottom:4px;font-size:.82rem}

.lvbar{display:inline-flex;align-items:center;gap:3px}
.lvbar i{width:5px;height:13px;border-radius:2px;background:var(--surface-3)}
.lvbar i.on{background:var(--accent)}

.empty{text-align:center;padding:26px 14px;color:var(--text-3);font-size:.82rem}
.empty svg{width:34px;height:34px;opacity:.35;display:block;margin:0 auto 8px}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.hashmark{position:absolute;width:0;height:0;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--text-2);margin-top:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:9px 18px;border-radius:10px;font-size:.82rem;font-weight:600;z-index:999;opacity:0;transition:.28s;box-shadow:0 10px 30px rgba(0,0,0,.22)}
#toast.on{transform:translateX(-50%);opacity:1}

.videoWrap{position:relative;background:#0f1420;border-radius:10px;overflow:hidden}
.videoWrap video{width:100%;display:block;max-height:260px}
.dropzone{border:2px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:.15s;background:var(--surface-2)}
.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone svg{width:30px;height:30px;color:var(--text-3);margin-bottom:6px}

.progressline{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.progressline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .3s}

footer{max-width:1280px;margin:22px auto;padding:16px 18px 30px;color:var(--text-3);font-size:.72rem;border-top:1px solid var(--line)}

@media print{
  .topbar,.tabbar,footer,.noprint{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  main{padding:0;max-width:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l8-8M11 4l9 9M15 4h5v5"/><circle cx="6" cy="6" r="2.2"/></svg>
      </span>
      <span>羽毛球专项教练工作台<small>ATHLETEIQ COACH WORKBENCH</small></span>
    </div>
    <div class="topState" id="topState"></div>
    <div class="modesw" id="modeSwitch">
      <button data-m="simple">简单模式</button>
      <button data-m="pro" class="on">专业模式</button>
    </div>
  </div>
</header>

<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>

<main>
<span id="today" class="hashmark"></span>
<span id="level" class="hashmark"></span>
<span id="lib" class="hashmark"></span>
<span id="log" class="hashmark"></span>
<span id="video" class="hashmark"></span>
<span id="data" class="hashmark"></span>
<span id="diag" class="hashmark"></span>
<span id="profile" class="hashmark"></span>
  <section class="view on" id="view-today"></section>
  <section class="view" id="view-lib"></section>
  <section class="view" id="view-log"></section>
  <section class="view" id="view-video"></section>
  <section class="view" id="view-data"></section>
  <section class="view" id="view-diag"></section>
  <section class="view" id="view-profile"></section>
</main>

<footer>
  所有力量 / 灵敏度 / 关节角度阈值均为通用运动科学参考值，不替代医疗诊断。出现夜间痛、静息痛、关节绞锁或不稳、明显肿胀、放射性疼痛时应停止训练并寻求专业医疗评估。数据保存在本机浏览器 localStorage，不上传任何服务器。
</footer>

<div id="toast"></div>

<script>
/* ==================================================================
   羽毛球专项教练工作台
   零依赖 · 单文件 · 离线可用 · 数据存 localStorage
   ================================================================== */
"use strict";

/* ==================== 一、静态知识库 ==================== */

const STORE_KEY = "bwb.v1";

/* 五大体能素质 */
const QUAL = [
  {id:"power",     n:"力量 / 爆发力", c:"var(--purple)"},
  {id:"speed",     n:"速度 / 灵敏",   c:"var(--blue)"},
  {id:"endurance", n:"专项耐力",     c:"var(--red)"},
  {id:"mobility",  n:"柔韧 / 活动度", c:"var(--teal)"},
  {id:"stability", n:"关节稳定性",   c:"var(--green)"}
];

/* ---------- 七大技术体系：技术要点 / 常见错误 / 配套素质 / 伤病风险 / 视频指标 ---------- */
const TECH = [
{
  id:"serve", n:"发球", sub:"正手发高远球 · 反手发小球", icon:"serve",
  goal:"把每一分发球的落点误差控制在 30cm 内，且不因发接发环节失分。",
  cues:[
    "站位：面对球网，前脚距前发球线约一个拍长，重心压在前脚掌，拍头高于手腕。",
    "反手发球持拍：拇指顶在拍柄宽面，其余三指自然扣握，拍面后仰不超过 30°。",
    "击球点：规则要求整个拍头必须低于手腕且低于腰部（约 1.15m），站位越低越好控制。",
    "发力：是「推送」而非「击打」，柔化腕部，用手指最后一瞬的捻转发力控制落点。",
    "随挥：顺势收至身体右前上方不超过 20cm，随挥越长越容易被对手读线路。"
  ],
  simple:[
    "站到发球线后面一步，侧身对着网。",
    "手抬到腰的高度，球拍放在身前。",
    "轻推球，不要抡大臂。",
    "球出手后马上举拍准备下一拍。"
  ],
  errors:[
    ["击球点过高（超过腰线）→ 被判违例", "把持球手放低到髋部并用手指轻托，反复做空载成功后再加球"],
    ["引拍过大，动作有停顿 → 被对手预判", "做「无引拍发球」限制练习：手臂固定，只用前臂和手指发力"],
    ["手腕僵硬，只有推没有捻", "对着墙壁发小球练习，追求球贴墙下落，20 球一组"],
    ["球发出后不举拍，第三拍被动", "发完立刻做「举拍—还原」的自动化衔接，教练口令陪练"]
  ],
  qual:["stability","mobility","endurance"],
  qw:{stability:.45, mobility:.3, endurance:.25},
  risks:[{p:"肘（内侧副韧带 / 屈肌总腱）",w:2},{p:"前臂屈肌群劳损",w:2},{p:"腰方肌代偿",w:1}],
  metrics:{elbowFlex:.5, contactHeight:.4, tempo:.6, wristsnap:.5, recovery:.4}
},
{
  id:"clear", n:"高远球", sub:"正手高远 · 头顶高远 · 被动过渡", icon:"clear",
  goal:"从己方底线打到对方底线，落点稳定在双打后发球线前后 1m 内。",
  cues:[
    "侧身架拍：转体约 90°，持拍肘抬到不低于肩的高度，形成「弓」的张力。",
    "蹬转发力链：屈膝蹬地 → 髋前送 → 转髋 → 甩肩 → 伸肘内旋 → 手腕鞭打，链条必须依次叠加。",
    "击球点：持拍侧肩前上方最高点，此时肘应有 160°-175° 的伸展角。",
    "内旋：初学者最大的分水岭，击球瞬间前臂内旋让拍面正对来球，靠拍面而非肩膀「甩」。",
    "随挥：顺势收向另一侧下方，重心前移进入下一拍准备。"
  ],
  simple:[
    "侧身站，把球拍举起来像拉弓。",
    "先把球让到身体的前上方，再打。",
    "打的时候脚下要蹬地，不能只靠手。",
    "打完手臂顺势往下收，赶紧回中间。"
  ],
  errors:[
    ["击球点偏后或偏低 → 打不出高度，变平抽", "多球「定点高远」：教练送出高球到固定位置，只允许在最高点击球"],
    ["肘低于肩就开始发力 → 只用肩甩，易伤肩袖", "靠墙架拍定型训练：背靠墙避免肘下垂，60s×3 组"],
    ["只用上半身转，没用蹬地", "做不持拍的「蹬地—转髋」慢动作链条练习，体会力量从脚底传上来"],
    ["手腕过早发力，触球就打滑", "先做慢速拖腕挥拍 100 次建立动作程序，再逐档提速"]
  ],
  qual:["power","mobility","stability"],
  qw:{power:.4, mobility:.35, stability:.25},
  risks:[{p:"肩袖（冈上肌）冲击 / 肩峰下撞击",w:3},{p:"腰椎旋转过载",w:2},{p:"髋屈肌紧张导致的代偿",w:1}],
  metrics:{shoulderAbd:1, elbowFlex:1, contactHeight:1, trunkRot:.8, hipShoulder:.8, wristsnap:.9, followThrough:.7, tempo:.5}
},
{
  id:"smash", n:"杀球", sub:"原地杀 · 跳杀 · 点杀 / 劈杀", icon:"smash",
  goal:"男线跳杀球速 > 220km/h（初速），落点可控；跳后第一步 0.5s 内完成复位。",

{id:"sleeper",q:"mobility",n:"睡眠者拉伸（肩内旋）",area:"肩后侧",rx:{s:"2组",r:"每侧30-45s",l:"自重",rest:"-"},i:2,how:"侧躺，下手伸往前成 90 度，上手扶住下手前臂，轻轻往下压，让肩后侧拉长。",cue:"感觉到肩后有拉伸感就停，别硬掰到疼。",why:"没有足够的肩内旋活动度，高远球架拍就会代偿到腰。"},

{id:"worldsgreatest",q:"mobility",n:"最伟大拉伸",area:"全身链式",rx:{s:"2组",r:"每侧6次",l:"自重",rest:"-"},i:3,how:"弓步—手撑地—转身把上手伸向天空—收回—再伸髋，一条龙做到底。",cue:"每一次呼气都再深入一点。",why:"热身阶段一次激活髋、胸椎、踝三处。"},
{id:"quadhip",q:"mobility",n:"股四头肌 / 髂腰肌拉伸",area:"髋屈肌",rx:{s:"2组",r:"每侧45s",l:"自重",rest:"-"},i:2,how:"单膝跪（后膝垫软垫），同侧手抓后脚背，把骨盆有一点点后倾的感觉再拉。",cue:"骨盆先摆正，别用腰顶。",why:"久坐 + 大量弓步会让髂腰肌短缩，拖累网前起步。"},

{id:"er90",q:"stability",n:"肩袖 · 90度侧卧外旋",area:"肩袖",rx:{s:"3组",r:"每侧15次",l:"轻弹力带",rest:"45s"},i:4,how:"侧躺，持球肘贴身弯 90 度，手里握轻哑铃/弹力带，把前臂向外转开再慢慢回来。",cue:"腋下夹一条毛巾，肘不能离开身体。",why:"这是「羽毛球肩」的头号处方动作。"},

/* ==================== 二、数据层 & 算法引擎 ==================== */

/* ---------- 工具 ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseD(s){const p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/86400000);}
function weekday(s){return parseD(s).getDay();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function sd(a){if(a.length<2)return 0;const m=avg(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));}
function round(v,n){const p=Math.pow(10,n||0);return Math.round(v*p)/p;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function levelOf(sc){for(let i=LEVELS.length-1;i>=0;i--){if(sc>=LEVELS[i].min)return LEVELS[i];}return LEVELS[0];}
function qualityName(id){const q=QUAL.find(x=>x.id===id);return q?q.n:id;}
function exById(id){return EX.find(e=>e.id===id)||DB.custom.find(e=>e.id===id);}
function techById(id){return TECH.find(t=>t.id===id);}

/* ---------- 存储 ---------- */
let DB = null;
function defaultDB(){
  return {
    v:1,
    profile:{name:"", sex:"m", age:22, height:175, weight:68, hand:"R", years:3,
             mode:"pro", freq:4, startDate:todayISO(), targetLevel:3, note:""},
    skills:{serve:55,clear:58,smash:50,drop:48,net:52,defense:50,footwork:55},
    logs:[], mind:[], weekly:[], wear:[], tests:[], vids:[], custom:[], levels:[], done:{}
  };
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    DB = raw?Object.assign(defaultDB(),JSON.parse(raw)):defaultDB();
  }catch(e){ DB=defaultDB(); }
  if(!DB.skills)DB.skills=defaultDB().skills;
  ["logs","mind","weekly","wear","tests","vids","custom","levels"].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});
  if(!DB.done)DB.done={};
  return DB;
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){toast("保存失败：本地存储空间不足");}}

/* ---------- 负荷模型（session-RPE：负荷 = 分钟 × RPE） ---------- */
function logLoad(l){return (l.dur||0)*(l.rpe||0);}
function loadOn(date){return DB.logs.filter(l=>l.date===date).reduce((s,l)=>s+logLoad(l),0);}
function loadWin(endDate,days){let s=0;for(let i=0;i<days;i++)s+=loadOn(addDays(endDate,-i));return s;}
function daysWithLoad(endDate,days){let c=0;for(let i=0;i<days;i++)if(loadOn(addDays(endDate,-i))>0)c++;return c;}
function acuteLoad(d){return loadWin(d,7)/7;}
function chronicLoad(d){const c=daysWithLoad(d,28);return c>=4?(loadWin(d,28)/28):(loadWin(d,28)/28);}
function acwr(d){
  const a=acuteLoad(d),c=chronicLoad(d);
  if(c<=0) return a>0?1.2:0;
  return round(a/c,2);
}
function monotony(d){const ws=[];for(let i=0;i<7;i++)ws.push(loadOn(addDays(d,-i)));const m=avg(ws),s=sd(ws);return s>0?round(m/s,2):0;}
function strain(d){return Math.round(loadWin(d,7)*monotony(d));}

/* ---------- 穿戴基线 ---------- */
function med(a){if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y);const h=b.length>>1;return b.length%2?b[h]:(b[h-1]+b[h])/2;}
function wearBase(k){const vals=DB.wear.map(w=>w[k]).filter(v=>typeof v==="number"&&!isNaN(v));return med(vals);}

/* ---------- 准备度 / 恢复 ---------- */
function checkinOf(d){return DB.mind.find(m=>m.date===d);}
function wearOf(d){return DB.wear.find(w=>w.date===d);}
function readiness(d){
  const c=checkinOf(d), w=wearOf(d);
  if(!c&&!w) return {score:null,parts:[],src:"无数据"};
  const parts=[]; let lost=0;
  const add=(k,v)=>{v=Math.max(0,v);parts.push({k:k,v:Math.round(v)});lost+=v;};
  if(c){
    if(c.sleep!=null) add("睡眠不足",Math.abs(8-c.sleep)*7);
    add("睡眠质量",(3-(c.sleepq||3))*5);
    add("精力偏低",(3-(c.energy||3))*5);
    add("情绪",(3-(c.mood||3))*3);
    add("肌肉酸痛",((c.sore||1)-1)*6);
    const p=c.pain||1;
    if(p>=3) add("关节疼痛",p===3?10:(p===4?20:28));
  }else add("缺少当日问卷",6);
  if(w){
    const bH=wearBase("hrv"), bR=wearBase("rhr");
    if(bH&&w.hrv){const dv=(w.hrv-bH)/bH; if(dv<-0.25)add("HRV 显著下降",18); else if(dv<-0.12)add("HRV 下降",9);}
    if(bR&&w.rhr&&w.rhr-bR>8) add("静息心率升高",10);
    if(w.sleepH&&w.sleepH<6.5) add("睡眠时间不足",(6.5-w.sleepH)*6);
  }
  const y=loadOn(addDays(d,-1)), ch=chronicLoad(d);
  if(ch>0&&y>ch*1.6) add("昨日负荷过大",8);
  return {score:Math.round(clamp(100-lost,0,100)),parts:parts,src:(c?"问卷":"")+(c&&w?" + ":"")+(w?"穿戴":"")};
}
function readinessSeries(d,n){const out=[];for(let i=n-1;i>=0;i--){const dd=addDays(d,-i);out.push({date:dd,score:readiness(dd).score});}return out;}

/* ---------- 技术评分 ---------- */
function latestVid(techId){
  const vs=DB.vids.filter(v=>v.tech===techId).slice().sort((a,b)=>a.date<b.date?1:-1);
  return vs[0]||null;
}
function techScore(techId){
  const base=DB.skills[techId]==null?50:DB.skills[techId];
  const v=latestVid(techId);
  if(!v) return {score:base,src:"自评 / 教练评分",vid:null};
  const ageW=Math.max(0,diffDays(todayISO(),v.date))/7;
  const w=1/(1+ageW/10);
  return {score:Math.round(clamp(base*(1-w)+v.score*w,0,100)),src:"视频评估 + 基线",vid:v};
}
function techDomain(){
  const per=TECH.map(t=>{const s=techScore(t.id);return {id:t.id,n:t.n,score:s.score,src:s.src};});
  return {per:per,score:Math.round(avg(per.map(p=>p.score)))};
}

/* ---------- 体能评分（测评 → 等级线插值） ---------- */
const PTS=[40,58,73,86];
function testScore(t,val){
  let v=parseFloat(val);
  if(isNaN(v))return null;
  const sexF = DB.profile.sex==="f" ? (t.f||1) : 1;
  const b = t.bench.map(x=>x*sexF);
  let s;
  if(t.better==="up"){
    if(v<=b[0]) s=PTS[0]-(b[0]-v)/((b[1]-b[0])||1)*18;
    else if(v>=b[3]) s=PTS[3]+(v-b[3])/((b[3]-b[2])||1)*8;
    else{for(let i=0;i<3;i++){if(v<=b[i+1]){s=PTS[i]+(v-b[i])/((b[i+1]-b[i])||1)*(PTS[i+1]-PTS[i]);break;}}}
  }else{
    if(v>=b[0]) s=PTS[0]-(v-b[0])/((b[0]-b[1])||1)*18;
    else if(v<=b[3]) s=PTS[3]+(b[3]-v)/((b[2]-b[3])||1)*8;
    else{for(let i=0;i<3;i++){if(v>=b[i+1]){s=PTS[i]+(b[i]-v)/((b[i]-b[i+1])||1)*(PTS[i+1]-PTS[i]);break;}}}
  }
  return clamp(Math.round(s),5,100);
}
function physicalDomain(){
  const lastTest=DB.tests.slice().sort((a,b)=>a.date<b.date?1:-1)[0]||null;
  const res=lastTest?lastTest.res:{};
  const bucket={}; QUAL.forEach(q=>bucket[q.id]=[]);
  TESTS.forEach(t=>{
    const v=res[t.id];
    if(v==null||v==="")return;
    const s=testScore(t,v);
    if(s!=null) bucket[t.q].push({id:t.id,n:t.n,unit:t.unit,val:parseFloat(v),score:s});
  });
  const w={power:.25,speed:.25,endurance:.2,mobility:.15,stability:.15};
  let num=0,den=0; const missing=[];
  QUAL.forEach(q=>{
    const arr=bucket[q.id];
    if(!arr.length){missing.push(q.n);return;}
    const qs=Math.round(avg(arr.map(a=>a.score)));
    bucket[q.id].score=qs; num+=qs*w[q.id]; den+=w[q.id];
  });
  const detail=QUAL.map(q=>({id:q.id,n:q.n,c:q.c,score:bucket[q.id].score==null?null:bucket[q.id].score,items:bucket[q.id]}));
  return {score:den?Math.round(num/den):null,detail:detail,missing:missing,date:lastTest?lastTest.date:null};
}

/* ---------- 恢复评分 ---------- */
function recoveryDomain(){
  const rs=readinessSeries(todayISO(),14).filter(r=>r.score!=null);
  if(!rs.length) return {score:null,parts:[],days:0};
  const l7=rs.slice(-7);
  const base = avg(l7.map(r=>r.score))*.6 + avg(rs.map(r=>r.score))*.4;
  let sc=base; const parts=[];
  const a=acwr(todayISO());
  if(a>1.5){sc-=16;parts.push({k:"ACWR 过高 "+a,v:-16});}
  else if(a>1.3){sc-=8;parts.push({k:"ACWR 偏高 "+a,v:-8});}
  else if(a>0&&a<0.6){sc-=8;parts.push({k:"负荷过低 "+a,v:-8});}
  const low=l7.filter(r=>r.score<60).length;
  if(low>=4){sc-=10;parts.push({k:"近 7 天有 "+low+" 天准备度 <60",v:-10});}
  return {score:Math.round(clamp(sc,0,100)),parts:parts,days:rs.length,raw:Math.round(base),acwr:a};
}

/* ---------- 瓶颈归因 ---------- */
function weakTechnique(){return techDomain().per.slice().sort((a,b)=>a.score-b.score)[0];}
function weakestQuality(detail){const v=detail.filter(d=>d.score!=null);return v.length?v.slice().sort((a,b)=>a.score-b.score)[0]:null;}
function bottleneck(){
  const T=techDomain(),P=physicalDomain(),R=recoveryDomain();
  const target=(LEVELS.find(l=>l.id===DB.profile.targetLevel)||LEVELS[2]).min;
  const tScore=T.score,pScore=(P.score==null?55:P.score),rScore=(R.score==null?70:R.score);
  const deficits=[
    {k:"tech", n:"技术短板", score:tScore, gap:target-tScore, w:1},
    {k:"phys", n:"体能弱项", score:pScore, gap:target-pScore, w:1},
    {k:"recov",n:"恢复不足", score:rScore, gap:target-rScore, w:1.15}
  ].sort((a,b)=>(b.gap*b.w)-(a.gap*a.w));
  const top=deficits[0], detail={type:top.k};
  if(top.k==="recov"){
    const rs=readinessSeries(todayISO(),7).filter(r=>r.score!=null);
    const recent=DB.mind.slice(-7);
    detail.drivers=R.parts.slice();
    if(rs.length) detail.mean7=Math.round(avg(rs.map(r=>r.score)));
    if(rs.length>2){const j=sd(rs.map(r=>r.score)); if(j>10)detail.drivers.push({k:"准备度波动偏大 SD "+Math.round(j),v:0});}
    detail.sleepAvg=round(avg(recent.map(m=>m.sleep||7.5)),1);
    detail.painMax=Math.max(0,...recent.map(m=>m.pain||1));
    if(!detail.drivers.length) detail.drivers=[{k:"缺少问卷 / 穿戴数据，无法进一步定位",v:0}];
  }else if(top.k==="tech"){
    const wt=weakTechnique(); const t=techById(wt.id); const v=latestVid(wt.id);
    detail.tech=wt; detail.vid=v;
    detail.worstMetric=(v&&v.metrics&&v.metrics.length)?v.metrics.slice().sort((a,b)=>a.score-b.score)[0]:null;
    detail.drills=t.errors.slice(0,2);
  }else{
    const wq=weakestQuality(P.detail); detail.quality=wq;
    detail.worstTests=(wq&&wq.items.length)?wq.items.slice().sort((a,b)=>a.score-b.score).slice(0,2):null;
    detail.missing=P.missing;
  }
  return {target:target,T:{score:tScore,detail:T},P:{score:pScore,detail:P},R:{score:rScore,detail:R},
    domains:deficits,primary:top,runnerUp:deficits[1],detail:detail,
    composite:Math.round(avg([tScore,pScore,rScore]))};
}

/* ---------- 中羽等级：问卷 → 等级 ---------- */
function cyFromAnswers(ans){
  const dims={},parts=[];
  CY_QS.forEach(q=>{
    const oi=clamp(ans[q.k]==null?0:parseInt(ans[q.k])||0,0,5);
    const d=Math.round((oi+1)*7/6);          // 6 档答案映射到 1-7 级刻度
    dims[q.k]=d; parts.push({k:q.k,n:q.n,v:d,w:q.w});
  });
  let num=0,den=0;parts.forEach(p=>{num+=p.v*p.w;den+=p.w;});
  const raw=num/den;
  let level=Math.round(raw);
  const applied=[];
  // 中羽分级的本质是「短板定级」：单项明显缺口会压住整体等级
  const caps=[
    {t:dims.power<=2,c:2,why:"发力方式尚未建立（内外旋 / 爆发力不足）"},
    {t:dims.back<=3,c:3,why:"正手后场不能稳定到位"},
    {t:dims.backhand<=2,c:3,why:"反手后场基本不会（俗称反手为 0）"},
    {t:dims.foot<=3,c:4,why:"移动 / 启动不足，实战表现低于动作表现"},
    {t:dims.def<=2,c:4,why:"防守质量有限，难以进入高强度对抗"},
    {t:dims.match<=3,c:5,why:"实战稳定性不足，动作尚未转化为比赛能力"}
  ];
  caps.forEach(r=>{if(r.t&&level>r.c){level=r.c;applied.push(r.why);}});
  const ci=clamp(ans.comp==null?0:parseInt(ans.comp)||0,0,5);
  const compBonus=[0,0,0,1,1,2][ci];
  level+=compBonus;
  if(ci<=1&&level>6)level=6;   // 无正式比赛经历不评 7 级
  level=clamp(Math.round(level),0,7);
  return {level:level,dims:dims,parts:parts,raw:round(raw,2),applied:applied,compBonus:compBonus,compIdx:ci,ans:ans};
}
function cyToInternal(lv){return lv<=2?1:(lv<=4?2:(lv<=6?3:4));}
function applyLevelResult(r){
  const d=r.dims, sc=x=>Math.round(clamp(18+x*11,0,100));
  DB.skills={
    serve:sc(d.grip), clear:sc(d.back),
    smash:sc(Math.min(d.back,d.power,d.attack)),
    drop:sc(Math.min(d.back,d.net)), net:sc(d.net),
    defense:sc(d.def), footwork:sc(d.foot)
  };
  const it=cyToInternal(r.level);
  DB.profile.currentCY=r.level;
  DB.profile.targetLevel=clamp(it+1,1,4);   // 目标定在下一档，驱动瓶颈诊断
  DB.levels.push({id:uid(),date:todayISO(),level:r.level,dims:d,raw:r.raw,ans:r.ans});
  save();
  return it;
}
function lastLevel(){return DB.levels.length?DB.levels[DB.levels.length-1]:null;}

/* ---------- 伤病风险预警 ---------- */
function warnings(){
  const out=[], today=todayISO();
  const recent=DB.mind.slice(-7).filter(m=>diffDays(today,m.date)<=7);
  const painMax=Math.max(0,...recent.map(m=>m.pain||1));
  const painSites=[...new Set(recent.filter(m=>(m.pain||1)>=3).map(m=>(m.painsite||"").trim()).filter(Boolean))];
  const a=acwr(today), chron=chronicLoad(today);
  if(chron>0){
    if(a>1.5) out.push({lv:"high",t:"急性负荷过高（ACWR "+a+"）",d:"近 7 天相对过去 4 周负荷比超过 1.5，是软组织损伤的高风险区间。",act:"未来 5-7 天总负荷下调 20-30%，删除跳跃与冲刺内容，保留技术与活动度。"});
    else if(a>1.3) out.push({lv:"mid",t:"负荷爬升偏快（ACWR "+a+"）",d:"已进入警戒区，若继续上行 1-2 周将进入高风险区。",act:"本周不新增高强度内容，插入 1 天完全休息。"});
    else if(a<0.6) out.push({lv:"low",t:"负荷过低（ACWR "+a+"）",d:"刺激不足以维持适应，回到对抗环境容易受伤。",act:"按每周 +10% 的节奏逐步恢复训练量。"});
  }
  if(painMax>=4) out.push({lv:"high",t:"静息 / 夜间疼痛信号",d:"出现 4 级以上疼痛，通常提示存在需要处理的组织问题。",act:"停止引发疼痛的动作，48 小时内无改善请就医评估。"});
  else if(painMax===3) out.push({lv:"mid",t:"运动中疼痛（3 级）"+(painSites.length?" · 部位："+painSites.join(" / "):""),d:"运动中疼痛会改变动作模式，形成二次代偿。",act:"把该部位负荷降到运动中不痛的水平，并在训练前后做对应预康复。"});
  const rs=readinessSeries(today,7).filter(r=>r.score!=null);
  if(rs.filter(r=>r.score<55).length>=3) out.push({lv:"high",t:"准备度持续偏低",d:"近 7 天有 3 天以上准备度低于 55，恢复系统已经跟不上。",act:"本周改为减量周：总量降 30%，睡眠补足 8 小时以上。"});
  const sleepAvg=avg(recent.map(m=>m.sleep||7.5));
  if(recent.length>=3&&sleepAvg<6.5) out.push({lv:"mid",t:"睡眠不足（近一周平均 "+round(sleepAvg,1)+" 小时）",d:"睡眠是反应速度、技术固化与组织修复的共同前提。",act:"固定熄灯时间，训练总量先降到与睡眠匹配的水平。"});
  const bH=wearBase("hrv"), lastW=DB.wear.slice(-1)[0];
  if(bH&&lastW&&lastW.hrv&&(lastW.hrv-bH)/bH<-0.2) out.push({lv:"mid",t:"HRV 明显低于个人基线",d:"相对基线下降超过 20%，副交感恢复不足。",act:"当日改为低强度技术或完全休息，避免高强度间歇。"});
  const P=physicalDomain(), stab=P.detail.find(d=>d.id==="stability");
  const sv=latestVid("smash");
  if(sv&&sv.metrics&&sv.metrics.length){
    const get=k=>sv.metrics.find(m=>m.k===k);
    const kv=get("kneeValgus"), land=get("landing");
    if(kv&&kv.score<60) out.push({lv:"mid",t:"落地 / 制动时膝内扣明显",d:"视频评估中膝-踝横向偏移得分 "+kv.score+"，长期把压力集中在髌股关节。",act:"训练前做落地缓冲 + 侧卧蚌式，技术课减少连续跳杀量。"});
    if(land&&land.score<60) out.push({lv:"mid",t:"落地稳定性不足",d:"跳杀后落地控制评分偏低，膝与跟腱承受额外冲击。",act:"加入静音落地与单腿平衡练习，每节课跳杀不超过 30 次。"});
  }
  if(stab&&stab.score!=null&&stab.score<62) out.push({lv:"mid",t:"关节稳定性储备不足",d:"稳定性项得分 "+stab.score+"，低于安全阈值，疲劳后变向时风险放大。",act:"每天 8 分钟稳定性质检：单腿平衡 + 星形偏移 + 侧平板。"});
  return out.sort((x,y)=>({high:0,mid:1,low:2}[x.lv])-({high:0,mid:1,low:2}[y.lv]));
}

/* ---------- 周期化 ---------- */
function currentPhase(d){
  const start=DB.profile.startDate||todayISO();
  const total=PHASES.reduce((s,p)=>s+p.w,0);
  let day=diffDays(d,start); if(day<0)day=0;
  const pos=day%(total*7);
  let acc=0;
  for(const p of PHASES){
    if(pos<acc+p.w*7) return {phase:p,weekInPhase:Math.floor((pos-acc)/7)+1,phaseTotal:p.w};
    acc+=p.w*7;
  }
  return {phase:PHASES[0],weekInPhase:1,phaseTotal:PHASES[0].w};
}
function phasePlan(d){
  const c=currentPhase(d), wd=weekday(d);
  const day=c.phase.week.find(x=>x.d===wd)||c.phase.week[0];
  return {cur:c,day:day};
}
function todayAdjust(){
  const r=readiness(todayISO()), a=acwr(todayISO());
  let mul=1; const notes=[];
  if(r.score!=null){
    if(r.score<50){mul*=.6;notes.push("准备度 "+r.score+"：今日降为低强度（计划负荷 ×0.6）");}
    else if(r.score<65){mul*=.8;notes.push("准备度 "+r.score+"：今日强度下调（×0.8）");}
    else if(r.score>85){mul*=1.05;notes.push("准备度 "+r.score+"：状态良好，可适度加量");}
  }else notes.push("今日还没有准备度数据，先做一次打卡再确认强度");
  if(a>1.5){mul*=.75;notes.push("ACWR "+a+" 过高：整体负荷再下调 25%");}
  return {mul:round(mul,2),notes:notes,readiness:r.score,parts:r.parts};
}
function relScore(p,techIds){
  let s=0;
  techIds.forEach(tid=>{const t=techById(tid); if(!t)return;
    t.risks.forEach(r=>{ if(p.n.indexOf(r.p.slice(0,2))>=0||p.n.indexOf(r.p.slice(0,1))>=0) s+=r.w; });});
  return s;
}

/* ---------- 4 周突破计划 ---------- */
function breakthrough(bn){
  const weeks=[];
  const baseWeekly=(DB.profile.freq||4)*55;           // 预估每周训练分钟
  const type=bn.primary.k;
  const tid=(bn.detail.type==="tech"&&bn.detail.tech)?bn.detail.tech.id:weakTechnique().id;
  const T=techById(tid)||TECH[0];
  for(let i=1;i<=4;i++){
    let mul=[1,1.1,1.2,.7][i-1];
    if(type==="recov") mul=[.7,.85,1,.65][i-1];
    let focus="", sessions=[];
    if(type==="tech"){
      focus=T.n+" 动作重塑 ｜ "+T.qual.map(qualityName).join(" / ")+" 配套积累";
      sessions=[
        {n:"技术重建",c:T.n+" 慢速分解 20 min + 中速连贯 15 min + 定点多球 15 min",l:7},
        {n:"配套体能",c:TECH_EX[tid][T.qual[0]].map(id=>{const e=exById(id);return e?e.n:"";}).filter(Boolean).join(" + "),l:7},
        {n:"专项迁移",c:"影子步法 + 限定线路的模拟对抗",l:6},
        {n:"恢复",c:"活动度 + 呼吸放松 + 睡眠补足",l:2}
      ];
    }else if(type==="phys"){
      const q=bn.detail.quality?bn.detail.quality.id:"power";
      focus=qualityName(q)+" 定向强化 ｜ 技术维持（量降 20%、保持质量）";
      const qex=EX.filter(e=>e.q===q);
      sessions=[
        {n:qualityName(q)+" 主课",c:qex.slice(0,3).map(e=>e.n+" "+e.rx.s+" × "+e.rx.r).join(" + "),l:8},
        {n:"技术维持",c:T.n+" 低疲劳练习 25 min，只求动作质量",l:5},
        {n:"专项转移",c:"多球 20:10 间歇 或 场地往返 15 趟",l:7},
        {n:"恢复",c:"活动度 + 预康复套件",l:2}
      ];
    }else{
      focus="恢复系统重建 ｜ 睡眠、营养与负荷节奏优先（技术仅做维持）";
      sessions=[
        {n:"低强度技术",c:T.n+" 半速练习 25 min + 固定线路",l:3},
        {n:"有氧基础",c:"心率 130-145 的匀速有氧 30-40 min",l:4},
        {n:"活动度 / 呼吸",c:"髋 + 胸椎 + 肩后链，配合膈式呼吸",l:2},
        {n:"完全休息",c:"不安排任何训练",l:0}
      ];
    }
    weeks.push({w:i,mul:mul,loadTarget:Math.round(baseWeekly*mul),focus:focus,sessions:sessions,
      note:i===4?"第 4 周为吸收周（deload）：用回落换来前三周适应的显现。":"每次训练后记录 RPE，周末复查准备度是否回到 70 以上。"});
  }
  return weeks;
}

/* ---------- 图表（纯 SVG） ---------- */
function chartLine(data,opt){
  opt=opt||{};
  const W=640,H=opt.h||150,PL=34,PR=8,PT=10,PB=22;
  if(!data.length)return '<div class="empty">暂无数据</div>';
  const vals=data.map(d=>d.v);
  const max=Math.max(1,...vals)*(opt.pad||1.15);
  const x=i=>PL+(W-PL-PR)*(data.length<2?.5:i/(data.length-1));
  const y=v=>PT+(H-PT-PB)*(1-v/max);
  let area="M"+x(0)+" "+y(vals[0]),line=area;
  data.forEach((d,i)=>{area+=" L"+x(i)+" "+y(d.v);if(i)line+=" L"+x(i)+" "+y(d.v);});
  area+=" L"+x(data.length-1)+" "+H-PB+" L"+x(0)+" "+H-PB+" Z";
  let grid="",lb="";
  for(let i=0;i<=3;i++){const gy=PT+(H-PT-PB)*i/3,gv=Math.round(max*(1-i/3));
    grid+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#e2e8f0" stroke-width="1"/>';
    grid+='<text x="'+(PL-5)+'" y="'+(gy+3.5)+'" text-anchor="end" font-size="9" fill="#8b97ad">'+gv+'</text>';}
  data.forEach((d,i)=>{ if(data.length<9||i%2===0||i===data.length-1)
    lb+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="#8b97ad">'+d.k+'</text>';});
  const dots=data.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d.v)+'" r="2.6" fill="'+(opt.color||"#3f51b5")+'"/>').join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+grid+
    '<path d="'+area+'" fill="'+(opt.fill||"rgba(63,81,181,.10)")+'"/>'+
    '<path d="'+line+'" fill="none" stroke="'+(opt.color||"#3f51b5")+'" stroke-width="2" stroke-linejoin="round"/>'+dots+lb+'</svg>';
}
function chartBars(data,opt){
  opt=opt||{};
  const W=640,H=opt.h||150,PL=34,PR=8,PT=10,PB=22;
  if(!data.length)return '<div class="empty">暂无数据</div>';
  const max=Math.max(1,...data.map(d=>d.v))*(opt.pad||1.2);
  const bw=(W-PL-PR)/data.length*0.62, step=(W-PL-PR)/data.length;
  let g="",lb="";
  for(let i=0;i<=3;i++){const gy=PT+(H-PT-PB)*i/3;
    g+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="#e2e8f0"/>';
    g+='<text x="'+(PL-5)+'" y="'+(gy+3.5)+'" text-anchor="end" font-size="9" fill="#8b97ad">'+Math.round(max*(1-i/3))+'</text>';}
  data.forEach((d,i)=>{
    const h=(H-PT-PB)*(d.v/max), x=PL+step*i+(step-bw)/2, y=H-PB-h;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="3" fill="'+(d.c||opt.color||"#3f51b5")+'"/>';
    if(data.length<10||i%2===0) lb+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="#8b97ad">'+d.k+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+lb+'</svg>';
}
function chartRadar(items){
  const W=420,H=300,cx=W/2,cy=H/2,R=Math.min(W,H)/2-46,n=items.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let grid="",axis="",poly="",dots="",lab="";
  [0.25,0.5,0.75,1].forEach(f=>{const p=[];for(let i=0;i<n;i++){const q=pt(i,R*f);p.push(q[0].toFixed(1)+","+q[1].toFixed(1));}
    grid+='<polygon points="'+p.join(" ")+'" fill="none" stroke="#e2e8f0"/>';});
  items.forEach((it,i)=>{
    const q=pt(i,R); axis+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#e2e8f0"/>';
    const v=Math.max(2,(it.v==null?0:it.v)/100*R); const p=pt(i,v);
    poly+=p[0].toFixed(1)+","+p[1].toFixed(1)+" ";
    dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#3f51b5"/>';
    const l=pt(i,R+20); const anc=l[0]>cx+8?"start":(l[0]<cx-8?"end":"middle");
    lab+='<text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'" text-anchor="'+anc+'" font-size="11" fill="#5b6780">'+esc(it.k)+'</text>';
    lab+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+13).toFixed(1)+'" text-anchor="'+anc+'" font-size="11" font-weight="700" fill="#16203a">'+(it.v==null?"—":it.v)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+grid+axis+
    '<polygon points="'+poly+'" fill="rgba(63,81,181,.18)" stroke="#3f51b5" stroke-width="2"/>'+dots+lab+'</svg>';
}
function lvBar(sc){
  const n=clamp(Math.ceil((sc||0)/25),1,4);
  return '<span class="lvbar">'+[1,2,3,4].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</span>';
}

function scoreRange(v,ideal,tol){
  const [lo,hi]=ideal,[tl,th]=tol;
  if(v>=lo&&v<=hi)return 100;
  let d=v<lo?(lo-v)/tl:(v-hi)/th;
  return Math.round(clamp(100-d*45,5,100));

/* 内置像素分析 */
async function grabFrames(file,maxFrames){
  const url=URL.createObjectURL(file);
  const video=document.createElement("video");
  video.src=url;video.muted=true;video.playsInline=true;video.preload="auto";
  await new Promise((res,rej)=>{video.onloadedmetadata=res;video.onerror=()=>rej(new Error("浏览器无法解码该视频，请换成 H.264 编码的 MP4/MOV 再试"));});
  const dur=Math.min(video.duration||5,45);
  const n=Math.min(maxFrames||90,Math.max(24,Math.round(dur*8)));
  const W=80,H=60,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  const frames=[];
  for(let i=0;i<n;i++){
    const t=dur*(i+0.5)/n;
    await new Promise(res=>{let done=false;const h=()=>{if(done)return;done=true;video.removeEventListener("seeked",h);res();};
      video.addEventListener("seeked",h);video.currentTime=Math.min(t,Math.max(0,dur-0.05));});
    ctx.drawImage(video,0,0,W,H);
    const px=ctx.getImageData(0,0,W,H).data;
    const g=new Float32Array(W*H);
    for(let p=0,q=0;p<W*H;p++,q+=4)g[p]=px[q]*.299+px[q+1]*.587+px[q+2]*.114;
    frames.push({t:t,g:g});
  }
  video.src="";
  return {frames:frames,W:W,H:H,dur:dur};
}
function analyzePixels(data,techId){
  const {frames,W,H,dur}=data, F=frames.length;
  const energy=[],cent=[];
  let leftE=0,rightE=0;
  for(let i=1;i<F;i++){
    const a=frames[i-1].g,b=frames[i].g;
    let s=0,cx=0,cy=0,m=0,l=0,r=0;
    for(let p=0;p<a.length;p++){
      const dv=Math.abs(b[p]-a[p]);
      if(dv>8){ s+=dv; const x=p%W,y=(p/W)|0; cx+=x*dv; cy+=y*dv; m+=dv; if(x<W/2)l+=dv; else r+=dv; }
    }
    energy.push(s/(a.length||1));
    cent.push({x:m?cx/m:W/2,y:m?cy/m:H/2,m:m});
    leftE+=l;rightE+=r;
  }
  const meanE=avg(energy); if(meanE<=0) throw new Error("视频中几乎没有检测到运动，可能是画面静止或分辨率过低");
  const norm=energy.map(e=>e/meanE);
  const smth=avg(norm.slice(1).map((v,i)=>Math.abs(v-norm[i])));
  const continuity=Math.round(clamp(100-(smth-.35)*70,20,100));
  const burst=round(Math.max(...norm),2);
  // 节奏：对能量序列做自相关，周期性越强得分越高
  let rhythm=null, cadence=null;
  {
    const e=norm, m=e.length, mn=avg(e);
    const z=e.map(v=>v-mn);
    const den=z.reduce((a,v)=>a+v*v,0)||1;
    let best=0,bestLag=0;
    for(let lag=3;lag<=Math.floor(m/2);lag++){
      let acc=0; for(let k=0;k+lag<m;k++) acc+=z[k]*z[k+lag];
      const r=acc/den;
      if(r>best){best=r;bestLag=lag;}
    }
    if(bestLag>2){
      const dt=data.dur/F;
      cadence=round(1/(bestLag*dt),2);
      rhythm=round(clamp(100*(1-best),0,100),1);
    }
  }
  const xs=cent.map(c=>c.x), ys=cent.map(c=>c.y);
  const travel=round(100*(Math.max(...xs)-Math.min(...xs))/W,1);
  const startD=round(100*(Math.sqrt(Math.pow(xs[xs.length-1]-xs[0],2)+Math.pow(ys[ys.length-1]-ys[0],2))/Math.sqrt(W*W+H*H)),1);
  const symmetry=round(100-50*Math.abs(leftE-rightE)/Math.max(leftE,rightE,1),1);
  const restore=Math.round(clamp(100-startD*1.6,20,100));
  const tw=PIXW[techId]||PIXW.clear;
  const raw=[
    {k:"continuity",n:"动作连贯性",v:continuity,base:100,u:"分",ideal:[65,100],tol:[35,25]},
    {k:"burst",n:"爆发 / 加速特征",v:burst,base:100,u:"倍",ideal:[2.2,9],tol:[1.3,6]},
    {k:"rhythm",n:"节奏一致性",v:rhythm,base:100,u:"%CV",ideal:[0,18],tol:[12,25]},
    {k:"travel",n:"重心控制",v:travel,base:100,u:"%画面",ideal:[15,45],tol:[20,25]},
    {k:"symmetry",n:"双侧动员比",v:symmetry,base:100,u:"%",ideal:[40,100],tol:[25,15]},
    {k:"cadence",n:"动作频率",v:cadence==null?0:cadence,base:100,u:"次/秒",ideal:[0.5,2.5],tol:[0.4,1.2]}
  ];
  let num=0,den=0;const metrics=[];
  raw.forEach(m=>{
    if(m.k==="cadence"&&m.v<=0)return;
    const sc=scoreRange(m.v,m.ideal,m.tol);
    const w=(m.k==="rhythm"||m.k==="travel")?(tw[m.k]||0)*(m.k==="travel"?restore/100:1):tw[m.k]||0;
    metrics.push({k:m.k,n:m.n,v:m.v,u:m.u,score:sc,fb:PIXFB[m.k][sc>=60?0:1]});
    num+=sc*(w||.1);den+=(w||.1);
  });
  const score=Math.round(clamp(num/den,0,100));
  return {tech:techId,engine:"pixel",score:score,metrics:metrics,dur:round(dur,1),frames:F,
    note:"共采样 "+F+" 帧（"+round(dur,1)+"s）。内置引擎通过帧间运动能量、重心轨迹与左右能量分布对动作进行粗粒度评估，能反映连贯性、爆发性与对称性，但不能替代关键的关节角度；如需精确角度请导入 YOLO 姿态 JSON。"};
}
/* YOLO 姿态分析 */
function ang(a,b,c){ // b 为顶点
  const v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]];
  const d=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(v1[0],v1[1])*Math.hypot(v2[0],v2[1])||1);
  return Math.acos(clamp(d,-1,1))*180/Math.PI;
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function analyzeYolo(json,techId){
  const raw=Array.isArray(json)?json:(json.frames||json.data||null);
  if(!raw||!raw.length) throw new Error("JSON 结构不正确：需要 {frames:[{t,kps:[[x,y,conf],...]}]}");
  const seq=raw.map(f=>({t:(f.t!=null?f.t:(f.time||0)),k:f.kps||f.keypoints||f.landmarks||[]}))
    .filter(f=>f.k&&f.k.length>=13).sort((a,b)=>a.t-b.t);
  if(seq.length<4) throw new Error("有效帧不足：需要至少 4 帧且每帧不少于 13 个可见关键点");
  const pick=(f,i)=>(f.k[i]&&f.k[i][2]>0.15)?f.k[i]:null;
  const ok=p=>!!p;
  const heights=[],shoulders=[],ankleYs=[];
  seq.forEach(f=>{
    const nose=pick(f,0),la=pick(f,15),ra=pick(f,16);
    if(ok(nose)&&(ok(la)||ok(ra))){const a=ok(la)?la:ra;heights.push(dist(nose,a));ankleYs.push(a[1]);}
    const ls=pick(f,5),rs=pick(f,6); if(ok(ls)&&ok(rs)) shoulders.push(dist(ls,rs));
  });
  const PH=med(heights)||300, SW=med(shoulders)||60, ANK=med(ankleYs)||PH;
  const pH=DB.profile.height||175, cmPerPx=pH/(PH||1);
  const rangeOf=idx=>{const a=seq.map(f=>pick(f,idx)).filter(ok).map(p=>p[1]);
    return a.length>2?(Math.max(...a)-Math.min(...a)):0;};
  const side=rangeOf(10)>=rangeOf(9)?"R":"L";
  const I=side==="R"?{sh:6,el:8,wr:10,hi:12,kn:14,an:16}:{sh:5,el:7,wr:9,hi:11,kn:13,an:15};
  const OPP=side==="R"?{sh:5,hi:11}:{sh:6,hi:12};

  let maxAbd=0,minElb=200,rotDeg=0,hipSep=0,kneeMin=200,valgusMax=0;
  let hipTop=1e9,hipLow=-1e9,hipXs=[],wrTop=1e9,wrTopT=0,wrPath=[],hipMidX=[];
  seq.forEach(f=>{
    const sh=pick(f,I.sh),el=pick(f,I.el),wr=pick(f,I.wr),hi=pick(f,I.hi),kn=pick(f,I.kn),an=pick(f,I.an);
    const osh=pick(f,OPP.sh),ohi=pick(f,OPP.hi);
    if(ok(sh)&&ok(osh)&&ok(hi)&&ok(ohi)){
      const sm=[(sh[0]+osh[0])/2,(sh[1]+osh[1])/2], hm=[(hi[0]+ohi[0])/2,(hi[1]+ohi[1])/2];
      hipMidX.push(hm[0]);
      const rot=Math.abs(sm[0]-hm[0])/SW;
      rotDeg=Math.max(rotDeg,Math.asin(clamp(rot,0,1))*180/Math.PI);
      const ls=pick(f,5),rs=pick(f,6),lh=pick(f,11),rh=pick(f,12);
      if(ok(ls)&&ok(rs)&&ok(lh)&&ok(rh)){
        const vs=[rs[0]-ls[0],rs[1]-ls[1]], vh=[rh[0]-lh[0],rh[1]-lh[1]];
        const c=(vs[0]*vh[0]+vs[1]*vh[1])/((Math.hypot(vs[0],vs[1])*Math.hypot(vh[0],vh[1]))||1);
        hipSep=Math.max(hipSep,Math.acos(clamp(c,-1,1))*180/Math.PI);
      }
      if(ok(el)){
        const torso=[hm[0]-sm[0],hm[1]-sm[1]], arm=[el[0]-sh[0],el[1]-sh[1]];
        const c=(torso[0]*arm[0]+torso[1]*arm[1])/((Math.hypot(torso[0],torso[1])*Math.hypot(arm[0],arm[1]))||1);
        maxAbd=Math.max(maxAbd,Math.acos(clamp(c,-1,1))*180/Math.PI);
      }
      hipTop=Math.min(hipTop,hm[1]);hipLow=Math.max(hipLow,hm[1]);
    }
    if(ok(sh)&&ok(el)&&ok(wr)) minElb=Math.min(minElb,ang(sh,el,wr));
    if(ok(hi)&&ok(kn)&&ok(an)){
      kneeMin=Math.min(kneeMin,ang(hi,kn,an));
      valgusMax=Math.max(valgusMax,Math.abs(kn[0]-an[0])/(dist(hi,an)||1)*100);
    }
    if(ok(wr)){ wrPath.push({t:f.t,p:wr,e:(ok(sh)&&ok(el))?ang(sh,el,wr):null}); if(wr[1]<wrTop){wrTop=wr[1];wrTopT=f.t;} }
  });
  if(hipMidX.length>2) hipXs=hipMidX;
  // 击球点高度（相对身体尺度）
  let contactH=null;
  if(wrPath.length) contactH=round((ANK-wrTop)/PH,3);
  // 触球瞬间的肘伸展角：取击球帧 ±2 帧内的最大伸展
  {
    const ci=wrPath.findIndex(w=>w.t===wrTopT);
    const win=ci>=0?wrPath.slice(Math.max(0,ci-1),ci+3).map(w=>w.e).filter(v=>v!=null):[];
    if(win.length) minElb=Math.max(...win);
  }
  // 腕峰速度（身高/秒）
  let snap=null;
  for(let i=1;i<wrPath.length;i++){
    const dt=Math.max(1e-3,wrPath[i].t-wrPath[i-1].t);
    snap=Math.max(snap||0,dist(wrPath[i].p,wrPath[i-1].p)/PH/dt);
  }
  if(snap!=null) snap=round(snap,2);
  // 节奏CV
  let rhythm=null;
  const spd=[];
  for(let i=1;i<wrPath.length;i++){const dt=Math.max(1e-3,wrPath[i].t-wrPath[i-1].t);spd.push(dist(wrPath[i].p,wrPath[i-1].p)/dt);}
  if(spd.length>6){
    const mx=Math.max(...spd),pk=[];
    for(let i=1;i<spd.length-1;i++) if(spd[i]>mx*.55&&spd[i]>=spd[i-1]&&spd[i]>=spd[i+1]&&(!pk.length||i-pk[pk.length-1]>2))pk.push(i);
    if(pk.length>=3){const iv=pk.slice(1).map((v,i)=>v-pk[i]);rhythm=round(100*sd(iv)/avg(iv),1);}
  }
  // 随挥完成度：击球后腕越过髋中线的最大幅度（%肩宽）
  let follow=null;
  if(hipXs.length&&wrPath.length){
    const ci=Math.max(0,wrPath.findIndex(w=>w.t===wrTopT));
    const base=hipXs[hipXs.length-1];
    let crossed=0;
    wrPath.slice(ci).forEach(w=>{ crossed=Math.max(crossed,Math.abs(w.p[0]-base)/SW); });
    follow=Math.round(clamp(crossed*100,0,100));
  }
  let travel=null;
  if(hipXs.length>3) travel=round(100*(Math.max(...hipXs)-Math.min(...hipXs))/SW,0);
  let jump=null;
  if(hipLow>hipTop) jump=round((hipLow-hipTop)*cmPerPx,1);
  let landing=null;
  if(valgusMax!=null){
    const tail=hipXs.slice(Math.max(0,Math.floor(hipXs.length*.75)));
    const jitter=tail.length>2?sd(tail)/SW*100:12;
    landing=Math.round(clamp((100-valgusMax*2.2)*.6+(100-jitter*1.6)*.4,5,100));
  }
  const wcfg=(TECH.find(t=>t.id===techId)||TECH[0]).metrics||{};
  const ans=[]; let num=0,den=0;
  const add=(k,v,u)=>{
    if(v==null||isNaN(v))return;
    const m=METRICS[k]; if(!m)return;
    if(m.only&&m.only.indexOf(techId)<0)return;
    const sc=scoreRange(v,m.ideal,m.tol), w=wcfg[k]||0.5;
    ans.push({k:k,n:m.n,v:round(v,2),u:u||m.u,score:sc,fb:FB[k][sc>=60?0:1]});
    num+=sc*w;den+=w;
  };
  add("shoulderAbd",maxAbd||null);
  add("elbowFlex",minElb<200?minElb:null);
  add("contactHeight",contactH);
  add("trunkRot",rotDeg||null);
  add("hipShoulder",hipSep||null);
  add("kneeFlex",kneeMin<200?kneeMin:null);
  add("kneeValgus",valgusMax||null);
  add("wristsnap",snap);
  add("followThrough",follow);
  add("tempo",rhythm);
  add("centroid",travel);
  add("jumpHeight",jump!=null&&jump>=0?jump:null);
  add("landing",landing);
  if(!ans.length) throw new Error("关键点信息不足，检查一下拍摄是否包含全身（尤其髋与踝）");
  return {tech:techId,engine:"yolo",score:Math.round(clamp(num/den,0,100)),metrics:ans,frames:seq.length,
    side:side,note:"基于 "+seq.length+" 帧 COCO-17 关键点解算（身体基准 "+Math.round(PH)+"px ≈ "+pH+"cm，肩宽 "+Math.round(SW)+"px）。单摄像头二维解算，绝对角度存在透视误差，建议固定机位纵向对比。"};
}

function parseCSV(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(lines.length<2) throw new Error("至少需要表头 + 1 行数据");
  const H=lines[0].split(/[,;\t]/).map(s=>s.trim().toLowerCase());
  const map={date:["date","日期","day","时间"],rhr:["resting_hr","rhr","静息心率","静息心率（bpm）"],
    hrv:["hrv","rmssd","心率变异性"],sleepH:["sleep_hours","sleep","sleeph","睡眠","睡眠时长","睡眠时间"],
    steps:["steps","步数"],load:["load","training_load","负荷","训练负荷"]};
  const idx={};Object.keys(map).forEach(k=>{idx[k]=H.findIndex(h=>map[k].indexOf(h)>=0);});
  if(idx.date<0) throw new Error("找不到日期列（date / 日期）");
  const rows=[];
  lines.slice(1).forEach((l,ri)=>{
    const c=l.split(/[,;\t]/).map(s=>s.trim());
    let d=c[idx.date]||"";
    d=d.replace(/\//g,"-");
    if(!/^\d{4}-\d{1,2}-\d{1,2}/.test(d))return;
    const p=d.slice(0,10).split("-");
    const iso=p[0]+"-"+String(+p[1]).padStart(2,"0")+"-"+String(+p[2]).padStart(2,"0");
    const num=i=>(i>=0&&c[i]!==""&&!isNaN(parseFloat(c[i])))?parseFloat(c[i]):null;
    rows.push({date:iso,rhr:num(idx.rhr),hrv:num(idx.hrv),sleepH:num(idx.sleepH),steps:num(idx.steps),load:num(idx.load)});
  });
  return rows;
}

document.addEventListener("click",function(e){

  switch(a){
    case "nav": VIEW=b.dataset.v;

      window.scrollTo(0,0); render(); break;
    case "mode": DB.profile.mode=b.dataset.m; save(); render(); break;
    case "libtab": LIBTAB=b.dataset.t; renderKeepScroll(); break;
    case "libtech": LIBTECH=b.dataset.t; renderKeepScroll(); break;
    case "print": window.print(); break;
    case "toggle":{
      const k=todayISO()+"|"+b.dataset.k;
      if(DB.done[k])delete DB.done[k]; else DB.done[k]=true;
      save(); renderKeepScroll(); break;
    }
    case "quicklog":{
      const l={id:uid(),date:todayISO(),dur:parseInt(el("qlDur").value)||60,rpe:parseInt(el("qlRpe").value)||6,
        type:el("qlType").value,note:el("qlNote").value};

    }

    case "delwear": DB.wear=DB.wear.filter(x=>x.date!==b.dataset.d);save();render();toast("已删除");break;

      const o={date:todayISO()};
      document.querySelectorAll("[data-q]").forEach(i=>{o[i.dataset.q]=i.value;});
      if(o.painsite==="")delete o.painsite;

      ["sleepq","energy","mood","sore","pain"].forEach(k=>{if(o[k]!=="")o[k]=parseInt(o[k]);});
      DB.mind=DB.mind.filter(m=>m.date!==o.date); DB.mind.push(o); save(); render(); toast("打卡已保存");
      break;
    }
    case "weekly":{
      const o={date:todayISO(),week:todayISO()};
      document.querySelectorAll("[data-w]").forEach(i=>{o[i.dataset.w]=i.value;});

    }

      const res={}; document.querySelectorAll("[data-t]").forEach(i=>{ if(i.value!=="")res[i.dataset.t]=parseFloat(i.value); });
      const dt=el("testDate").value||todayISO();

    }
    case "savewear":{

      [["wRhr","rhr"],["wHrv","hrv"],["wSleep","sleepH"],["wSteps","steps"],["wLoad","load"]].forEach(p=>{

    case "yolopaste": parseYoloText(); break;
    case "savevid":{
      if(!VIDSTATE.result){toast("还没有分析结果");break;}
      const r=VIDSTATE.result;
      DB.vids.push({id:uid(),date:todayISO(),tech:r.tech,engine:r.engine,score:r.score,metrics:r.metrics,note:r.note});
      save();toast("已存入成长档案，技术水平评分已同步更新");VIEW="diag";render();break;
    }
    case "csvimport": importCSV(); break;
    case "export": exportDB(); break;
    case "import": el("dbFile").click(); break;
    case "seed": seedDemo(); render(); break;
    case "reset":{
      if(confirm("将清空本机保存的全部训练数据（无法撤销），确认继续？")){
        localStorage.removeItem(STORE_KEY);load();render();toast("已清空");
      }
      break;
    }
    case "levelsubmit":{
      const ans={}, missing=[];
      document.querySelectorAll("[data-lq]").forEach(i=>{
        if(i.value==="-1"||i.value===""||i.value==null) missing.push(i.dataset.lq);
        else ans[i.dataset.lq]=parseInt(i.value);
      });
      if(missing.length){toast("还有 "+missing.length+" 项没有选择，请全部填完再提交");break;}
      const r=cyFromAnswers(ans);
      const it=applyLevelResult(r);
      LEVEL_LAST=r; render();
      toast("定级完成：中羽 "+r.level+" 级 · "+CY_LEVELS[r.level].n+"，已同步 "+LEVELS[it-1].n+" 基线");
      break;
    }
    case "levelreset": LEVEL_LAST=null; render(); toast("已清空本次结果，可重新填写"); break;
    case "leveldemo":{
      document.querySelectorAll("[data-lq]").forEach(i=>{ i.value=(i.dataset.lq==="comp")?"2":"3"; });
      toast("已填入 4 级示例答案，点「提交并生成等级」查看效果"); break;
    }
    case "dellevel":{
      DB.levels=DB.levels.filter(x=>x.id!==b.dataset.id);
      if(!DB.levels.length)DB.profile.currentCY=null;
      LEVEL_LAST=null; save(); render(); toast("已删除该次定级记录"); break;
    }
    case "demopose":{
      const tech=(el("vidTech")&&el("vidTech").value)||VIDSTATE.tech;
      try{
        const r=analyzeYolo(demoPoseFrames(),tech);
        VIDSTATE.result=r; el("vidResult").innerHTML=renderResult(r);
        toast("示例姿态评估完成："+r.score+" 分，可点「存入成长档案」");
      }catch(err){ toast("示例分析失败："+err.message); }
      break;
    }
    case "dldemo": downloadDemoPose(); break;
    case "saveprofile": saveProfile(); break;
  }
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.act==="videofile"&&t.files&&t.files[0]) onVideoFile(t.files[0]);
  if(t.dataset&&t.dataset.act==="yolofile"&&t.files&&t.files[0]) onYoloFile(t.files[0]);
  if(t.dataset&&t.dataset.act==="csvfile"&&t.files&&t.files[0]){
    const fr=new FileReader(); fr.onload=()=>{el("csvText").value=fr.result;}; fr.readAsText(t.files[0]);
  }
  if(t.dataset&&t.dataset.act==="dbfile"&&t.files&&t.files[0]) onDBFile(t.files[0]);
  if(t.id==="vidTech"){VIDSTATE.tech=t.value;}
  if(t.dataset&&t.dataset.sk){ DB.skills[t.dataset.sk]=parseInt(t.value); const s=el("sk-"+t.dataset.sk); if(s)s.textContent=t.value; save(); }
});
document.addEventListener("input",function(e){
  if(e.target.dataset&&e.target.dataset.sk){
    DB.skills[e.target.dataset.sk]=parseInt(e.target.value);
    const s=el("sk-"+e.target.dataset.sk); if(s)s.textContent=e.target.value; save();
  }
});
el("modeSwitch").addEventListener("click",function(e){
  const b=e.target.closest("button"); if(!b)return;
  DB.profile.mode=b.dataset.m; save(); render(); toast(DB.profile.mode==="pro"?"已切换到专业模式":"已切换到简单模式：只给执行清单");
});

/* ---------- 动作函数 ---------- */
function saveProfile(){
  const p=DB.profile;
  p.name=el("pfName").value; p.sex=el("pfSex").value; p.age=parseInt(el("pfAge").value)||22;
  p.height=parseInt(el("pfH").value)||175; p.weight=parseInt(el("pfW").value)||68;
  p.hand=el("pfHand").value; p.years=parseInt(el("pfY").value)||3; p.freq=parseInt(el("pfF").value)||4;
  p.startDate=el("pfStart").value||todayISO(); p.targetLevel=parseInt(el("pfTarget").value)||3;
  save();toast("档案已保存");render();
}
function onVideoFile(file){
  if(VIDSTATE.videoURL)URL.revokeObjectURL(VIDSTATE.videoURL);
  VIDSTATE.videoURL=URL.createObjectURL(file); VIDSTATE.fileRef=file; VIDSTATE.result=null;
  const pv=el("vidPreview");
  if(pv)pv.innerHTML='<div class="videoWrap"><video controls src="'+VIDSTATE.videoURL+'"></video></div>'+
    '<div style="font-size:.76rem;color:var(--text-3);margin-top:6px">'+esc(file.name)+'　'+round(file.size/1048576,2)+' MB</div>';
  const pr=el("vidProg"); if(pr)pr.innerHTML='<div class="note">视频已就绪，点击「开始内置分析」即可（全程本地处理）。</div>';
}
async function runPixel(){
  if(!VIDSTATE.fileRef){toast("请先选择视频文件");return;}
  const pr=el("vidProg"); if(pr)pr.innerHTML='<div class="note">正在逐帧采样…<div class="progressline"><i style="width:35%"></i></div></div>';
  try{
    const data=await grabFrames(VIDSTATE.fileRef,90);
    if(pr)pr.innerHTML='<div class="note">采样完成 '+data.frames.length+' 帧，正在计算运动学特征…<div class="progressline"><i style="width:75%"></i></div></div>';
    const tech=(el("vidTech")&&el("vidTech").value)||VIDSTATE.tech;
    const res=analyzePixels(data,tech);
    VIDSTATE.result=res;
    el("vidResult").innerHTML=renderResult(res);
    if(pr)pr.innerHTML='<div class="note ok">分析完成，综合得分 '+res.score+'。可在右侧「存入成长档案」。</div>';
  }catch(err){
    if(pr)pr.innerHTML='<div class="note dang">分析失败：'+esc(err.message)+'</div>';
    toast("分析失败："+err.message);
  }
}
function onYoloFile(file){
  const fr=new FileReader();
  fr.onload=()=>{handleYolo(fr.result);};
  fr.readAsText(file);
}
function parseYoloText(){
  const txt=el("yoText").value.trim();
  if(!txt){toast("请先粘贴 JSON 内容");return;}
  handleYolo(txt);
}
function handleYolo(txt){
  try{
    const json=JSON.parse(txt);
    const tech=(el("vidTech")&&el("vidTech").value)||VIDSTATE.tech;
    const res=analyzeYolo(json,tech);
    VIDSTATE.result=res;
    el("vidResult").innerHTML=renderResult(res);
    toast("YOLO 姿态评估完成："+res.score+" 分");
  }catch(e){
    toast("解析失败："+e.message);
  }
}
function demoPoseFrames(){
  const arr=[],cx=200;
  for(let i=0;i<48;i++){
    const ph=i/47*Math.PI*2, dip=Math.max(0,Math.sin(ph)), up=.5-.5*Math.cos(ph);
    const kneeX=cx+18+10*dip, kneeY=275-14*dip, hipY=200+9*dip;
    const wrist=[cx+40+28*Math.sin(ph*2),250-215*up];
    const elbow=[cx+30+18*Math.sin(ph*2),150-92*up];
    const k=[];
    k[0]=[cx,50,.95];k[1]=[cx-6,45,.9];k[2]=[cx+6,45,.9];k[3]=[cx-10,50,.85];k[4]=[cx+10,50,.85];
    k[5]=[cx-25,90,.95];k[6]=[cx+25,90,.95];
    k[7]=[cx-30,150,.9];k[8]=[elbow[0],elbow[1],.93];
    k[9]=[cx-40,250,.9];k[10]=[wrist[0],wrist[1],.96];
    k[11]=[cx-20,hipY,.95];k[12]=[cx+20,hipY,.95];
    k[13]=[cx-18,kneeY-4,.93];k[14]=[kneeX,kneeY,.93];
    k[15]=[cx-18,350,.95];k[16]=[cx+18,350,.95];
    arr.push({t:round(i*.033,3),kps:k});
  }
  return {video:"demo-pose.json",fps:30,model:"synthetic-demo",frames:arr};
}
function downloadDemoPose(){
  const blob=new Blob([JSON.stringify(demoPoseFrames(),null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="demo-pose.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("示例姿态 JSON 已下载");
}

function importCSV(){
  try{
    const rows=parseCSV(el("csvText").value);
    if(!rows.length){toast("没有解析到有效数据行");return;}
    rows.forEach(r=>{ DB.wear=DB.wear.filter(x=>x.date!==r.date); DB.wear.push(r); });
    save();
    el("csvOut").innerHTML='<div class="note ok">成功导入 '+rows.length+' 条穿戴数据，日期范围 '+rows[rows.length-1].date+' ~ '+rows[0].date+'</div>';
    renderTop();
  }catch(e){ el("csvOut").innerHTML='<div class="note dang">'+esc(e.message)+'</div>'; }
}
function exportDB(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="badminton-workbench-"+(DB.profile.name||"备份")+"-"+todayISO()+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("已导出备份文件");
}
function onDBFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d||typeof d!=="object")throw new Error("文件格式不正确");
      DB=Object.assign(defaultDB(),d); save(); render(); toast("数据已从备份恢复");
    }catch(e){toast("恢复失败："+e.message);}
  };
  fr.readAsText(file);
}

/* ---------- 初始化 ---------- */
function hashView(){
  try{
    const h=String(location.hash||"").replace(/^#/,"");
    return TABS.some(t=>t.id===h)?h:null;
  }catch(e){return null;}
}
load();
try{ const hv=hashView(); if(hv)VIEW=hv; }catch(e){}
try{
  window.addEventListener("hashchange",function(){
    const hv=hashView();
    if(hv){ VIEW=hv; window.scrollTo(0,0); render(); }
  });
}catch(e){}
render();

</script>
